[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aoa-v2-surgical-spine"
version = "0.1.0"
description = "AoA v2 Surgical Spine Continuity Protocol"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aoa-spine = "core.cli:main"

[tool.setuptools]
packages = ["core"]

